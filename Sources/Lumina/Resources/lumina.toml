space-count = 10
focus-follows-mouse = false
# Park a new window in the stash corner until its tile lands, so the app's
# own default frame is not visible.
pre-park-new-windows = true
# Write a new standard window straight to its predicted tile instead of the
# corner. Off by default; falls back to the corner on any doubt.
speculative-tile = false
# z-order, float-existing, or new-only
launch-tiling = "z-order"
launch-apps = []                       # e.g. ["com.apple.Terminal"]

[gaps]
inner = 8
outer = 8

# Apps whose tabs are separate windows (macOS native tabbing). Lumina
# keeps one tile per window and swaps the backing window on tab switch.
[native-tabs]
apps = ["com.apple.Terminal", "com.mitchellh.ghostty"]

[bindings]
alt-h = "focus left"
alt-j = "focus down"
alt-k = "focus up"
alt-l = "focus right"
alt-shift-h = "swap left"
alt-shift-j = "swap down"
alt-shift-k = "swap up"
alt-shift-l = "swap right"
alt-minus = "resize shrink"
alt-equal = "resize grow"
alt-leftSquareBracket = "workspace prev"
alt-rightSquareBracket = "workspace next"
alt-b = "balance"
alt-f = "fullscreen lumina"
alt-shift-f = "fullscreen native"
alt-space = "float-toggle"
alt-q = "close"
alt-1 = "workspace 1"
alt-2 = "workspace 2"
alt-3 = "workspace 3"
alt-4 = "workspace 4"
alt-5 = "workspace 5"
alt-6 = "workspace 6"
alt-7 = "workspace 7"
alt-8 = "workspace 8"
alt-9 = "workspace 9"
alt-0 = "workspace 10"
alt-shift-1 = "move-node-to-workspace 1"
alt-shift-2 = "move-node-to-workspace 2"
alt-shift-3 = "move-node-to-workspace 3"
alt-shift-4 = "move-node-to-workspace 4"
alt-shift-5 = "move-node-to-workspace 5"
alt-shift-6 = "move-node-to-workspace 6"
alt-shift-7 = "move-node-to-workspace 7"
alt-shift-8 = "move-node-to-workspace 8"
alt-shift-9 = "move-node-to-workspace 9"
alt-shift-0 = "move-node-to-workspace 10"

[[window-rule]]
app-id = "com.apple.systempreferences"
action = "float"

[[window-rule]]
app-id = "com.apple.Preferences"
action = "float"

