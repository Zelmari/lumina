name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test
        run: swift test
      - name: Package app and cask
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          LUMINA_BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/release.sh "${RELEASE_TAG#v}"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            "dist/Lumina-${RELEASE_TAG#v}-arm64.zip" \
            dist/SHA256SUMS dist/tap/Casks/lumina.rb \
            --verify-tag --draft --title "Lumina ${RELEASE_TAG#v}" \
            --notes-file docs/release-notes.md
