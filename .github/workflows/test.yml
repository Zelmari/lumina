name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift toolchain deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils libcurl4-openssl-dev libedit2 libgcc-13-dev \
            libncurses-dev libpython3-dev libsqlite3-0 libstdc++-13-dev \
            libxml2-dev libz3-dev pkg-config uuid-dev zlib1g-dev
      - name: Install Swift 6.3.3
        run: |
          set -euo pipefail
          curl -fsSL -O "https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz"
          tar zxf "swiftly-$(uname -m).tar.gz"
          ./swiftly init --assume-yes --quiet-shell-followup
          # shellcheck disable=SC1090
          . "${SWIFTLY_HOME_DIR:-$HOME/.local/share/swiftly}/env.sh"
          hash -r
          POST=/tmp/swiftly-post-install.sh
          swiftly install 6.3.3 --use --assume-yes --post-install-file="$POST"
          if [[ -s "$POST" ]]; then sudo bash "$POST"; fi
          echo "${SWIFTLY_HOME_DIR:-$HOME/.local/share/swiftly}/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/swiftly/bin" >> "$GITHUB_PATH"
          echo "SWIFTLY_HOME_DIR=${SWIFTLY_HOME_DIR:-$HOME/.local/share/swiftly}" >> "$GITHUB_ENV"
      - name: Test layout and IPC
        run: |
          # shellcheck disable=SC1090
          . "${SWIFTLY_HOME_DIR:-$HOME/.local/share/swiftly}/env.sh"
          hash -r
          swift --version
          swift test --filter LuminaLayoutTests
          swift test --filter LuminaIPCTests
