name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layout-and-ipc:
    name: Layout and IPC
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Swift toolchain deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils libcurl4-openssl-dev libedit2 libgcc-13-dev \
            libncurses-dev libpython3-dev libsqlite3-0 libstdc++-13-dev \
            libxml2-dev libz3-dev pkg-config uuid-dev zlib1g-dev
      - name: Install Swift 6.3.3
        run: |
          set -euo pipefail
          curl -fsSL -O "https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz"
          tar zxf "swiftly-$(uname -m).tar.gz"
          ./swiftly init --assume-yes --quiet-shell-followup
          # shellcheck disable=SC1090
          . "${SWIFTLY_HOME_DIR:-$HOME/.local/share/swiftly}/env.sh"
          hash -r
          POST=/tmp/swiftly-post-install.sh
          swiftly install 6.3.3 --use --assume-yes --post-install-file="$POST"
          if [[ -s "$POST" ]]; then sudo bash "$POST"; fi
          echo "${SWIFTLY_HOME_DIR:-$HOME/.local/share/swiftly}/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/swiftly/bin" >> "$GITHUB_PATH"
          echo "SWIFTLY_HOME_DIR=${SWIFTLY_HOME_DIR:-$HOME/.local/share/swiftly}" >> "$GITHUB_ENV"
      - name: Test layout and IPC
        # macOS targets are stripped on Linux. The harness needs Accessibility
        # and stays a local script.
        run: |
          # shellcheck disable=SC1090
          . "${SWIFTLY_HOME_DIR:-$HOME/.local/share/swiftly}/env.sh"
          hash -r
          swift --version
          swift test --filter LuminaLayoutTests
          swift test --filter LuminaIPCTests

  macos:
    name: macOS build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build release products and test
        # Compiles the menu extra, agent, and CLI. Does not run the harness:
        # that needs a logged-in session, Accessibility, and Automation.
        run: |
          swift --version
          swift build -c release --product lumina --product lumina-agent --product LuminaExtra
          swift test --filter LuminaLayoutTests
          swift test --filter LuminaIPCTests
